<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Management System</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>Student Management System</h1>

        <!-- ADD STUDENT -->
        <div class="card">

            <h2>Add Student</h2>

            <form id="studentForm">

                <input
                    type="text"
                    id="name"
                    placeholder="Enter student name"
                    required
                >

                <input
                    type="text"
                    id="course"
                    placeholder="Enter course"
                    required
                >

                <input
                    type="number"
                    id="marks"
                    placeholder="Enter marks"
                    min="0"
                    max="100"
                    required
                >

                <button type="submit">
                    Add Student
                </button>

            </form>

        </div>


        <!-- STUDENT LIST -->
        <div class="card">

            <h2>Students</h2>

            <button type="button" onclick="getStudents()">
                Refresh Students
            </button>

            <table>

                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Course</th>
                        <th>Marks</th>
                        <th>Actions</th>
                    </tr>
                </thead>

                <tbody id="studentTableBody">
                    <!-- Students will appear here -->
                </tbody>

            </table>

        </div>

    </div>


    <!-- JAVASCRIPT -->
    <script src="script.js?v=2"></script>

</body>

</html>
